name: Browser suites

# Reusable workflow: the single list of Playwright browser suites, shared by check.yml (pull requests) and
# deploy.yml (pushes to main), so the two can never drift apart. It has no trigger of its own; callers decide
# when it runs (both call it after their deterministic checks pass) and what the job depends on.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [mixed-client-migration-e2e, learning-v6-migration-e2e, conversation-storage-e2e, conversation-player-e2e, profile-data-lifecycle-e2e, profile-backup-e2e, conversation-speech-ui-e2e, conversation-support-e2e, conversation-study-e2e, ai-status-independent-e2e, course-attribution-e2e, lesson-owner-e2e, dictionary-senses-e2e, programme-navigation-e2e, unified-review-e2e, review-accent-followups-e2e, phase-workshop-e2e, startup-e2e, accent-policy-e2e, verb-pacing-e2e, journey-pacing-e2e, game-family-pacing-e2e, verb-flow-v2-e2e, course-v2-e2e, sentence-lab-e2e, grammar-course-e2e, grammar-offline-e2e, completion-menu-e2e, practice-controls-e2e, review-layout-e2e, short-words-e2e, adaptive-e2e, journey-e2e, lesson-actions-e2e, lesson-experience-e2e, lesson-activities-e2e, lesson-overview-e2e, noun-forms-e2e, game-learning-e2e, offline-e2e, e2e]
    env:
      PLAYWRIGHT_DIR: /tmp/parola-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser dependencies
        run: |
          npm install --prefix "$PLAYWRIGHT_DIR" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser behavior
        run: node tests/${{ matrix.suite }}.mjs
      - name: Verify the course on WebKit
        if: matrix.suite == 'conversation-study-e2e' || matrix.suite == 'ai-status-independent-e2e' || matrix.suite == 'mixed-client-migration-e2e' || matrix.suite == 'lesson-owner-e2e' || matrix.suite == 'conversation-support-e2e' || matrix.suite == 'conversation-player-e2e' || matrix.suite == 'profile-data-lifecycle-e2e' || matrix.suite == 'profile-backup-e2e' || matrix.suite == 'conversation-speech-ui-e2e' || matrix.suite == 'course-attribution-e2e' || matrix.suite == 'journey-pacing-e2e' || matrix.suite == 'game-family-pacing-e2e' || matrix.suite == 'learning-v6-migration-e2e' || matrix.suite == 'conversation-storage-e2e' || matrix.suite == 'dictionary-senses-e2e' || matrix.suite == 'programme-navigation-e2e' || matrix.suite == 'unified-review-e2e' || matrix.suite == 'accent-policy-e2e' || matrix.suite == 'course-v2-e2e' || matrix.suite == 'verb-flow-v2-e2e' || matrix.suite == 'verb-pacing-e2e'
        run: |
          "$PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps webkit
          COURSE_BROWSER=webkit VERB_BROWSER=webkit node tests/${{ matrix.suite }}.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-reports-${{ matrix.suite }}
          path: |
            tests/report-*.json
            docs/implementation/programme/*-chromium.json
            docs/implementation/programme/*-webkit.json
            docs/implementation/programme/startup-performance.json
