name: Check application

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_DIR: /tmp/parola-tools
      PGLITE_DIR: /tmp/parola-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate data and learning behavior
        run: |
          node tools/validate.mjs data/vocab/*.json data/verbs/*.json
          node tools/build-data.mjs
          node tools/build-course-index.mjs
          node tools/test-accent-policy.mjs
          node tools/test-phase-migration-fixtures.mjs
          node tools/test-unified-learning.mjs
          node tools/test-daily-course-path.mjs
          node tools/test-conversation-continuation.mjs
          node tools/test-journey-scene.mjs
          node tools/test-journey-import-counter.mjs
          node tools/test-journey-form-history.mjs
          node tools/test-formal-ci-agreement.mjs
          node tools/test-impersonal-fixed-feedback.mjs
          node tools/test-prior-only-journey-targets.mjs
          node tools/test-journey-builder-boundary.mjs
          node tools/test-journey-form-content-review.mjs
          node tools/build-verb-question-history.mjs --check
          node tools/test-verb-repairs-402.mjs
          node tools/test-verb-repairs-522.mjs
          node tools/test-verb-repairs-764.mjs
          node tools/test-verb-language-review-ledger.mjs
          node tools/test-verb-finite-spans.mjs
          node tools/test-verb-repairs-271.mjs
          node --test tests/ai-input-spelling.test.mjs
          node --test tests/ai-assistance.test.mjs
          node --test tests/ai-practice-sources.test.mjs
          node tools/test-journey-pacing.mjs
          node tools/test-lexical-senses.mjs
          node tools/test-lexical-frequency-senses.mjs
          node tools/test-conversation-summary.mjs
          node --test tests/conversation-study.test.mjs
          node tools/test-phase6-beginner.mjs
          node tools/test-phase6-intermediate.mjs
          node tools/test-phase6-advanced.mjs
          node tools/test-conversation-support.mjs
          node tools/test-spoken-feedback.mjs
          node tools/test-language-policy.mjs
          node --test dev/phase-1-ai-trial/speech-session.test.mjs
          node --test dev/phase-1-ai-trial/service.test.mjs
          node tools/test-phase-persistence.mjs
          node tools/test-learning-index.mjs
          node tools/test-lazy-course.mjs
          node tools/test-phase-content-fixes.mjs
          node tools/audit-phase-curriculum.mjs --programme --check
          node tools/test-noun-forms.mjs
          node tools/check-modules.mjs
          node tools/check-shell.mjs
          node tools/test-conjugator.mjs
          node tools/test-course-v2-content.mjs --recovery
          node tools/test-course-v2-engine.mjs
          node tools/test-course-v2-durability.mjs
          node tools/test-course-v2-assets.mjs
          node tools/test-course-v2-lexicon.mjs
          node tools/test-course-v2-editorial.mjs
          node tools/test-course-words.mjs
          node tools/test-sentence-lab.mjs
          node tools/test-phase-workshop.mjs
          node tools/test-workshop-agreement-review.mjs
          node tools/author-workshop-source-examples.mjs --check
          node tools/test-workshop-source-examples.mjs
          node tools/author-workshop-template-revisions.mjs --check
          node tools/test-workshop-template-revisions.mjs
          node tools/test-ai-trial.mjs
          node tools/test-useful-words.mjs
          node --test tests/ai-authored-practice-sources.test.mjs
          node tools/test-fit-retirement.mjs
          node tools/test-assistant-guard.mjs
          node tools/test-grammar-course.mjs
          node tools/test-grammar-durability.mjs
          node tools/test-grammar-evidence.mjs
          node tools/test-grammar-lexicon.mjs
          node tools/test-learning-model.mjs
          node tools/test-learning-questions.mjs
          node tools/test-learning-store-sync.mjs
          node tools/test-store-durability.mjs
          node tools/test-learning-integration.mjs
          node tools/test-learning-completion.mjs
          node tools/test-lesson-content.mjs
          node tools/test-sentence-lookup.mjs
          node tools/test-word-questions.mjs
          node tools/test-short-word-model.mjs
          node tools/test-journey-model.mjs
          node tools/test-lesson-activities.mjs
          node tools/build-verb-progressive.mjs --check
          node tools/test-progressive-content.mjs
          node tools/test-verb-flow-v2.mjs
          node tools/test-verb-pacing.mjs
          node tools/test-verb-scene-variety.mjs
          node tools/test-journey-integration.mjs
      - name: Verify SQL migration
        run: |
          npm install --prefix "$PGLITE_DIR" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          node tools/test-learning-sql.mjs
  # The Playwright suites (matrix, fail-fast off, isolated Playwright install, WebKit pass for the course suites,
  # report upload) live in browser.yml, shared with deploy.yml so pushes to main run exactly the same list.
  browser:
    needs: check
    uses: ./.github/workflows/browser.yml
