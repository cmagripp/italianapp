name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Job graph: build (deterministic checks, assemble dist/, upload the Pages artifact) -> browser (the 19 Playwright
# suites from browser.yml, in parallel) -> deploy. deploy needs both, so nothing is published unless every check and
# every browser suite passed. The workflow-level "pages" group serializes whole runs in push order, so an older run
# can never deploy after a newer one; a newer push waiting in the queue replaces any older one still waiting.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The default shell (bash -e) stops at the first failing command, so a schema error, an incomplete build, a failing
      # engine check or a precache list that no longer matches the file tree all fail the job before anything is uploaded.
      - name: Validate source data, build dictionary data, run engine tests & check the offline shell
        run: |
          node tools/validate.mjs data/vocab/*.json data/verbs/*.json
          node tools/build-data.mjs
          node tools/test-noun-forms.mjs
          node tools/check-modules.mjs
          node tools/test-conjugator.mjs
          node tools/test-course-v2-content.mjs --recovery
          node tools/test-course-v2-engine.mjs
          node tools/test-course-v2-durability.mjs
          node tools/test-course-v2-assets.mjs
          node tools/test-course-v2-lexicon.mjs
          node tools/test-course-v2-editorial.mjs
          node tools/test-grammar-course.mjs
          node tools/test-grammar-durability.mjs
          node tools/test-grammar-lexicon.mjs
          node tools/test-learning-model.mjs
          node tools/test-learning-questions.mjs
          node tools/test-learning-store-sync.mjs
          node tools/test-store-durability.mjs
          node tools/test-learning-integration.mjs
          node tools/test-learning-completion.mjs
          node tools/test-lesson-content.mjs
          node tools/test-sentence-lookup.mjs
          node tools/test-word-questions.mjs
          node tools/test-short-word-model.mjs
          node tools/test-journey-model.mjs
          node tools/test-lesson-activities.mjs
          node tools/build-verb-progressive.mjs --check
          node tools/test-progressive-content.mjs
          node tools/test-verb-flow-v2.mjs
          node tools/test-verb-pacing.mjs
          node tools/test-verb-scene-variety.mjs
          node tools/test-journey-integration.mjs
          node tools/stamp-sw.mjs
          node tools/check-shell.mjs
      # Copies only the deployable files into dist/ (no docs, tests, tools, dev, .github or scratch files) and exits
      # non-zero on failure, so a broken assembly stops the job before anything is uploaded.
      - name: Assemble the deployable site
        run: node tools/build-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # Same suites, same isolated Playwright install as pull requests (check.yml); starts once build has passed.
  browser:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/browser.yml
  deploy:
    needs: [build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
