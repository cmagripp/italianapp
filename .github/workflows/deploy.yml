name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The default shell (bash -e) stops at the first failing command, so a schema error, an incomplete build, a failing
      # engine check or a precache list that no longer matches the file tree all fail the job before anything is uploaded.
      - name: Validate source data, build dictionary data, run engine tests & check the offline shell
        run: |
          node tools/validate.mjs data/vocab/*.json data/verbs/*.json
          node tools/build-data.mjs
          node tools/check-modules.mjs
          node tools/test-conjugator.mjs
          node tools/test-learning-model.mjs
          node tools/test-learning-questions.mjs
          node tools/test-learning-store-sync.mjs
          node tools/test-learning-integration.mjs
          node tools/check-shell.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
