<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Parola · "Notte italiana" app icon. Fraunces italic P (opsz 96, wght 700, SOFT 40) embedded as an outline. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101629"/>
      <stop offset="1" stop-color="#070912"/>
    </linearGradient>
    <radialGradient id="orbGold"><stop offset="0" stop-color="#f7c94f" stop-opacity="1"/><stop offset=".4" stop-color="#f2c14e" stop-opacity=".62"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbLamp"><stop offset="0" stop-color="#ffe6a3" stop-opacity=".95"/><stop offset="1" stop-color="#ffd97a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbTerra"><stop offset="0" stop-color="#ef7448" stop-opacity="1"/><stop offset=".4" stop-color="#e0673f" stop-opacity=".6"/><stop offset="1" stop-color="#e0673f" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbTurq"><stop offset="0" stop-color="#3ee6cf" stop-opacity="1"/><stop offset=".4" stop-color="#2dd4bf" stop-opacity=".58"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbAmalfi"><stop offset="0" stop-color="#4cc6fb" stop-opacity=".95"/><stop offset=".45" stop-color="#38bdf8" stop-opacity=".45"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset=".55" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#e3a832"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="44"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    </filter>
    <clipPath id="tileClip"><rect x="96" y="96" width="320" height="320" rx="76" /></clipPath>
  </defs>

  <!-- backdrop: ink night + aurora orbs (gold lamp, terracotta, Amalfi turquoise) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g opacity=".88">
    <g filter="url(#soft)">
      <circle cx="118" cy="92" r="262" fill="url(#orbGold)"/>
      <circle cx="150" cy="112" r="96" fill="url(#orbLamp)"/>
      <circle cx="476" cy="306" r="256" fill="url(#orbTerra)"/>
      <circle cx="76" cy="472" r="238" fill="url(#orbTurq)"/>
      <circle cx="336" cy="526" r="176" fill="url(#orbAmalfi)"/>
    </g></g>
  <rect width="512" height="512" filter="url(#grain)" opacity=".5"/>

  <!-- floating glass tile: soft shadow, frosted (blurrier, lighter) view of the aurora, light edges -->
  <rect x="96" y="112" width="320" height="320" rx="76" fill="#000" opacity=".42" filter="url(#shadow)"/>
  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g opacity=".95">
    <g filter="url(#frost)">
      <circle cx="118" cy="92" r="262" fill="url(#orbGold)"/>
      <circle cx="150" cy="112" r="96" fill="url(#orbLamp)"/>
      <circle cx="476" cy="306" r="256" fill="url(#orbTerra)"/>
      <circle cx="76" cy="472" r="238" fill="url(#orbTurq)"/>
      <circle cx="336" cy="526" r="176" fill="url(#orbAmalfi)"/>
    </g></g>
    <rect x="96" y="96" width="320" height="320" rx="76" fill="url(#glass)"/>
    <rect x="96" y="96" width="320" height="320" rx="76" fill="url(#sheen)"/>
  </g>
  <rect x="97" y="97" width="318" height="318" rx="75" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <rect x="99.5" y="99.5" width="313" height="313" rx="72.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="1"/>

