  <!-- tricolore rail -->
  <g opacity=".92"><rect x="212" y="372" width="24" height="9" rx="4.5" fill="#2fb673"/><rect x="244" y="372" width="24" height="9" rx="4.5" fill="#f4efe6"/><rect x="276" y="372" width="24" height="9" rx="4.5" fill="#e0483f"/></g>
</svg>
